[project]
name = "mioa-core"
version = "0.1.0"
description = "Shared Mioa native runtime, profile, reference and ownership core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mioa-os-api==0.1.0",
  "psutil==7.2.2",
  "requests==2.34.2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS",
]

[tool.uv.sources]
mioa-os-api = { path = "../mioa-os/api/system" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mioa_core*"]
