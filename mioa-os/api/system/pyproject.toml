[project]
name = "mioa-os-api"
version = "0.1.0"
description = "Provider-neutral Mioa Host contracts"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "mioa_os_api/**/*.py" }]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mioa_os_api*"]
