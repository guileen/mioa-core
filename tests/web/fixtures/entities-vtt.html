<script>
window.caseReady = false;
window.entitiesTrackEvent = null;
const entitiesVttUrl = URL.createObjectURL(new Blob(
  [document.getElementById('entities-vtt-source').textContent],
  { type: 'text/vtt' }
));
const entitiesTrack = document.createElement('track');
entitiesTrack.id = 'entities-track';
entitiesTrack.kind = 'subtitles';
entitiesTrack.default = true;
for (const type of ['load', 'error']) {
  entitiesTrack.addEventListener(type, () => {
    window.entitiesTrackEvent = type;
    URL.revokeObjectURL(entitiesVttUrl);
    window.caseReady = true;
  });
}
entitiesTrack.src = entitiesVttUrl;
document.getElementById('entities-video').appendChild(entitiesTrack);
</script>
