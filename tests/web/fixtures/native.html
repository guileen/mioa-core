<title>Raw native paint, document and input identity</title>
<style>html,body{margin:0;background:#fff}#box{position:absolute;left:20px;top:20px;width:40px;height:40px;background:#ff0000}input{position:absolute;box-sizing:border-box;left:100px;top:20px;width:120px;height:30px}</style>
