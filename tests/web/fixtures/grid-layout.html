<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>grid layout and text decoration fixture</title>
  <style>
    body { margin: 0; }
    .grid-wrap {
      display: grid;
      grid-template-columns: 80px 120px;
      width: 200px;
    }
    .col-a {
      text-decoration: underline;
      background: #f0f0f0;
    }
    .col-b {
      text-decoration: line-through;
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="grid-wrap">
    <div id="item-a" class="col-a">First column text</div>
    <div id="item-b" class="col-b">Second column text</div>
  </div>
</body>
</html>
