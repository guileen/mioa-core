<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>accessibility aria mapping fixture</title>
</head>
<body>
  <div id="custom-button" role="button" aria-label="Perform Action" aria-required="true" aria-hidden="false">Custom Action</div>
  <form id="contact-form" aria-label="Customer Feedback">
    <h2 id="section-title">Feedback Form</h2>
    <input id="email-field" type="text" aria-label="Email Address" required>
    <button id="submit-btn" type="button">Submit Feedback</button>
  </form>
</body>
</html>
